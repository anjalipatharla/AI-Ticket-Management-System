name: Backend authentication tests

on:
  push:
    branches:
      - main
      - feature/complete-auth-authorization
  pull_request:
    branches:
      - main

jobs:
  accounts-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: TMS
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks and account tests
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DB_NAME: TMS
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          GOOGLE_CLIENT_ID: test-google-client-id
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          DEFAULT_FROM_EMAIL: ci@example.test
        run: |
          python manage.py check
          python manage.py test accounts
